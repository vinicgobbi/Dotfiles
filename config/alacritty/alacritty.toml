# ==========================
# Alacritty config - Dracula (Oficial)
# ==========================

###########
# GENERAL #
###########

[general]
import = []
working_directory = "None"
live_config_reload = true
ipc_socket = true

[env]

##########
# WINDOW #
##########

[window]
decorations = "Full"
dynamic_padding = true
startup_mode = "Windowed"
# Garante que as decorações da janela usem o tema escuro
decorations_theme_variant = "Dark"

dimensions = { columns = 0, lines = 0 }
position = "None"
padding = { x = 0, y = 0 }
resize_increments = false
title = "Alacritty"
dynamic_title = true
class = { instance = "Alacritty", general = "Alacritty" }

###########
# SCROLLING #
###########

[scrolling]
history = 10000
multiplier = 3

########
# FONT #
########

[font]
normal = { family = "FiraCode Nerd Font", style = "Regular" }
bold = { style = "Bold" }
italic = { style = "Italic" }
bold_italic = { style = "Bold Italic" }
size = 12.0

#########
# COLORS #
# Paleta oficial Dracula (dracula/alacritty)
# https://draculatheme.com/alacritty
#########

[colors]
# Cores primárias
primary = { foreground = "#f8f8f2", background = "#282a36" } # Foreground / Background

# Cores do cursor
cursor = { text = "#282a36", cursor = "#f8f8f2" }
vi_mode_cursor = { text = "#282a36", cursor = "#f8f8f2" }

# Cores normais (ANSI)
[colors.normal]
black   = "#21222c"
red     = "#ff5555"
green   = "#50fa7b"
yellow  = "#f1fa8c"
blue    = "#bd93f9"
magenta = "#ff79c6"
cyan    = "#8be9fd"
white   = "#f8f8f2"

# Cores brilhantes (ANSI)
[colors.bright]
black   = "#6272a4"
red     = "#ff6e6e"
green   = "#69ff94"
yellow  = "#ffffa5"
blue    = "#d6acff"
magenta = "#ff92df"
cyan    = "#a4ffff"
white   = "#ffffff"

# Cores de busca (Mapeadas para cores do Dracula)
[colors.search]
matches = { foreground = "#282a36", background = "#f1fa8c" } # Fundo: Yellow
focused_match = { foreground = "#282a36", background = "#8be9fd" } # Fundo: Cyan

# Cores de hints (Mapeadas para cores do Dracula)
[colors.hints]
start = { foreground = "#282a36", background = "#8be9fd" } # Fundo: Cyan
end = { foreground = "#282a36", background = "#ff6e6e" } # Fundo: Red claro

########
# CURSOR #
########

[cursor]
style = { shape = "Block", blinking = "On" }
thickness = 0.15
unfocused_hollow = true
vi_mode_style = "None"
blink_interval = 750
blink_timeout = 5

###########
# TERMINAL #
###########

[terminal]
osc52 = "OnlyCopy"

########
# MOUSE #
########

[mouse]
hide_when_typing = false
bindings = []

########
# HINTS #
########

[hints]
alphabet = "jfkdls;ahgurieowpq"

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
binding = { key = "U", mods = "Control|Shift" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\\u0000-\\u001F\\u007F-\\u009F<>\"\\s{-}\\^⟨⟩`]+"

############
# KEYBOARD #
############

[keyboard]
bindings = []

########
# BELL #
########

[bell]
animation = "Linear"
duration = 0
color = "#f8f8f2"
command = "None"

########
# DEBUG #
########

[debug]
render_timer = false
persistent_logging = false
log_level = "Warn"
renderer = "None"
print_events = false
highlight_damage = false
prefer_egl = false