# ==========================
# Alacritty config - Libadwaita Dark (Oficial)
# ==========================

###########
# GENERAL #
###########

[general]
import = []
working_directory = "None"
live_config_reload = true
ipc_socket = true

[env]

##########
# WINDOW #
##########

[window]
decorations = "Full"
dynamic_padding = true
startup_mode = "Windowed"
# Garante que as decorações da janela usem o tema escuro
decorations_theme_variant = "Dark"

dimensions = { columns = 0, lines = 0 }
position = "None"
padding = { x = 0, y = 0 }
resize_increments = false
title = "Alacritty"
dynamic_title = true
class = { instance = "Alacritty", general = "Alacritty" }

###########
# SCROLLING #
###########

[scrolling]
history = 10000
multiplier = 3

########
# FONT #
########

[font]
normal = { family = "FiraCode Nerd Font", style = "Regular" }
bold = { style = "Bold" }
italic = { style = "Italic" }
bold_italic = { style = "Bold Italic" }
size = 12.0

#########
# COLORS #
# Paleta baseada na documentação oficial do Libadwaita Dark
# https://gnome.pages.gitlab.gnome.org/libadwaita/doc/1.5/named-colors.html
#########

[colors]
# Cores primárias
primary = { foreground = "#ffffff", background = "#242424" } # @window_fg_color / @window_bg_color

# Cores do cursor
cursor = { text = "#242424", cursor = "#ffffff" }
vi_mode_cursor = { text = "#242424", cursor = "#ffffff" }

# Cores normais (ANSI)
[colors.normal]
black   = "#303030" # @content_bg_color
red     = "#c01c28" # @error_bg_color
green   = "#26a269" # @success_bg_color
yellow  = "#ae7b03" # @warning_bg_color
blue    = "#3584e4" # @accent_bg_color
magenta = "#9141ac" # @purple_3
cyan    = "#2ec27e" # @teal_3
white   = "#dedede" # @light_4 (para contraste suave)

# Cores brilhantes (ANSI)
[colors.bright]
black   = "#636363" # @dark_4
red     = "#ff7b63" # @error_fg_color
green   = "#8ff0a4" # @success_fg_color
yellow  = "#f8e45c" # @warning_fg_color
blue    = "#78aeed" # @accent_fg_color
magenta = "#ab6bc6" # @purple_2
cyan    = "#67d9a1" # @teal_2
white   = "#ffffff" # @window_fg_color

# Cores de busca (Mapeadas para cores do Libadwaita)
[colors.search]
matches = { foreground = "#242424", background = "#f8e45c" } # Fundo: @warning_fg_color
focused_match = { foreground = "#242424", background = "#78aeed" } # Fundo: @accent_fg_color

# Cores de hints (Mapeadas para cores do Libadwaita)
[colors.hints]
start = { foreground = "#242424", background = "#78aeed" } # Fundo: @accent_fg_color
end = { foreground = "#242424", background = "#ff7b63" } # Fundo: @error_fg_color

########
# CURSOR #
########

[cursor]
style = { shape = "Block", blinking = "On" }
thickness = 0.15
unfocused_hollow = true
vi_mode_style = "None"
blink_interval = 750
blink_timeout = 5

###########
# TERMINAL #
###########

[terminal]
osc52 = "OnlyCopy"

########
# MOUSE #
########

[mouse]
hide_when_typing = false
bindings = []

########
# HINTS #
########

[hints]
alphabet = "jfkdls;ahgurieowpq"

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
binding = { key = "U", mods = "Control|Shift" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\\u0000-\\u001F\\u007F-\\u009F<>\"\\s{-}\\^⟨⟩`]+"

############
# KEYBOARD #
############

[keyboard]
bindings = []

########
# BELL #
########

[bell]
animation = "Linear"
duration = 0
color = "#ffffff"
command = "None"

########
# DEBUG #
########

[debug]
render_timer = false
persistent_logging = false
log_level = "Warn"
renderer = "None"
print_events = false
highlight_damage = false
prefer_egl = false