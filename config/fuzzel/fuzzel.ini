# ==========================
# Fuzzel Theme Escuro - estilo Dracula
# ==========================

[main]
exit-on-keyboard-focus-loss=no  # não fecha ao perder foco
font=Adwaita Sans 14
dpi-aware=auto
use-bold=yes
letter-spacing=0

# Layout
anchor=center
x-margin=10
y-margin=10
width=35           # porcentagem da tela
lines=10
horizontal-pad=12
vertical-pad=8
inner-pad=4
layer=overlay

# Mouse
enable-mouse=yes

# ==========================
# Cores Dracula (mesma paleta do sway/waybar/alacritty/cava/wlogout)
# ==========================
[colors]
background=#282a36ff        # Background
text=#f8f8f2ff               # Foreground
prompt=#8be9fdff              # Cyan
placeholder=#6272a4ff        # Comment
input=#f8f8f2ff               # Foreground
match=#8be9fdff                # Cyan (destaque correspondência)
selection=#bd93f9ff            # Purple (fundo selecionado)
selection-text=#282a36ff        # Background (contraste sobre o purple)
selection-match=#f1fa8cff        # Yellow para contraste sobre a seleção
counter=#6272a4ff                # Comment
border=#bd93f9ff                   # Purple

[border]
width=1
radius=12                  # cantos arredondados estilo libadwaita

[dmenu]
mode=text
exit-immediately-if-empty=no

[key-bindings]
cancel=Escape Control+g Control+c
execute=Return KP_Enter
execute-or-next=Tab
cursor-left=Left Control+b
cursor-right=Right Control+f
cursor-home=Home Control+a
cursor-end=End Control+e
delete-prev=BackSpace Control+h
prev=Up Control+p
next=Down Control+n
