# ==========================
# Fuzzel Theme Escuro - estilo libadwaita dark
# ==========================

[main]
exit-on-keyboard-focus-loss=no  # não fecha ao perder foco
font=Adwaita Sans 14
dpi-aware=auto
use-bold=yes
letter-spacing=0

# Layout
anchor=center
x-margin=10
y-margin=10
width=35           # porcentagem da tela
lines=10
horizontal-pad=12
vertical-pad=8
inner-pad=4
layer=overlay

# Mouse
enable-mouse=yes

# ==========================
# Cores estilo libadwaita dark
# ==========================
[colors]
background=#1e1e1eff       # fundo escuro
text=#e0e0e0ff             # texto claro
prompt=#cfcfcfff            # prompt
placeholder=#a0a0a0ff       # placeholder
input=#e0e0e0ff             # input texto
match=#009688ff             # destaque correspondência (teal)
selection=#2a2a2aff         # fundo selecionado escuro
selection-text=#ffffffff    # texto selecionado
selection-match=#00bfa5ff   # match dentro da seleção (verde teal)
counter=#a0a0a0ff           # contador
border=#3a3a3aff            # borda escura

[border]
width=1
radius=12                  # cantos arredondados estilo libadwaita

[dmenu]
mode=text
exit-immediately-if-empty=no

[key-bindings]
cancel=Escape Control+g Control+c
execute=Return KP_Enter
execute-or-next=Tab
cursor-left=Left Control+b
cursor-right=Right Control+f
cursor-home=Home Control+a
cursor-end=End Control+e
delete-prev=BackSpace Control+h
prev=Up Control+p
next=Down Control+n
