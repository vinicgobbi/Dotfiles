# ==================================
# GTK4 - Tema Dracula
# ==================================
# Redundante com o gsettings setado em config/sway/config, mas cobre apps
# GTK4 que não respeitam gsettings. Apps libadwaita "puros" ignoram
# gtk-theme-name e seguem apenas prefer-dark-theme + accent color.

[Settings]
gtk-theme-name=Dracula
gtk-icon-theme-name=Dracula
gtk-cursor-theme-name=Dracula-cursors
gtk-font-name=Adwaita Sans 10
gtk-application-prefer-dark-theme=1
