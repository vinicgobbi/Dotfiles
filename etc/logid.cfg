devices: (
{
    name: "MX Master 3S";

    smartshift: {
        on: true;
        threshold: 255;
        default_threshold: 255;
    };

    hiresscroll: {
        hires: true;
        invert: false;
        target: false;
    };

    thumbwheel:
    {
        divert: true;
        invert: false;
        left:
        {
            mode: "OnInterval";
            threshold: 1;
            interval: 1;
            action =
            {
                type: "Keypress";
                keys: ["KEY_VOLUMEDOWN"];
            };
        },
        right:
        {
            mode: "OnInterval";
            threshold: 1;
            interval: 1;
            action =
            {
                type: "Keypress";
                keys: ["KEY_VOLUMEUP"];
            };
        };
    };
    buttons: (
        {
            cid: 0xc3;
            action: {
                type: "Gestures";
                gestures: (
                    {
                        direction: "None";
                        mode: "OnRelease";
                        action: {
                            type: "Keypress";
                            keys: ["KEY_PLAYPAUSE"];
                        };
                    },
                    {
                        direction: "Up";
                        mode: "OnRelease";
                        action: {
                            type: "Keypress";
                            keys: ["KEY_MUTE"];
                        };
                    },
                    {
                        direction: "Down";
                        mode: "OnRelease";
                        action: {
                            type: "Keypress";
                            keys: ["KEY_LEFTMETA", "KEY_L"];
                        };
                    },
                    {
                        direction: "Left";
                        mode: "OnRelease";
                        action: {
                            type: "Keypress";
                            keys: ["KEY_PREVIOUSSONG"];
                        };
                    },
                    {
                        direction: "Right";
                        mode: "OnRelease";
                        action: {
                            type: "Keypress";
                            keys: ["KEY_NEXTSONG"];
                        };
                    }
                );
            };
        }
    );
}
);
